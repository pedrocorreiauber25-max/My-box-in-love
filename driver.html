<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e9b8c2"><title>Entrega | My Box in Love"><style>:root{--pink:#f8e5e9;--brown:#80502f;--ink:#46332e}*{box-sizing:border-box}body{margin:0;background:#fff6f8;color:var(--ink);font:16px system-ui}header{text-align:center;padding:28px 16px;background:linear-gradient(145deg,#e9b8c2,#f8e5e9)}main{max-width:540px;margin:24px auto;padding:0 16px}.card{background:white;border:1px solid #f0dce1;border-radius:18px;padding:22px;margin:14px 0}h1{margin:0;color:var(--brown)}button{width:100%;border:0;border-radius:13px;padding:16px;margin-top:12px;font:700 16px system-ui;background:var(--brown);color:white}button:disabled{opacity:.5}#stop{background:#a33b45}.muted{color:#927f79;line-height:1.5}.state{font-weight:800;color:var(--brown)}</style></head><body><header><h1>MY BOX IN LOVE</h1><p>Entrega ao domicílio</p></header><main><section class="card"><h2>Iniciar entrega</h2><p class="muted">Quando estiveres a caminho da morada, inicia a partilha. A localização só será enviada enquanto a entrega estiver ativa.</p><p id="state" class="state">A aguardar início.</p><button id="start">Iniciar percurso</button><button id="stop" disabled>Entregue</button><p id="msg" class="muted" aria-live="polite"></p></section><p class="muted">A localização é usada apenas para mostrar a aproximação ao cliente. Ao tocar em “Entregue”, a partilha é terminada e as coordenadas são apagadas.</p></main><script>(()=>{const API='https://tlhcwzpyuhitjxymapbm.supabase.co/functions/v1/super-handler',KEY='sb_publishable_5MEUbRMWp8Y7lbRIBE9QxA_GT1D3rtb',token=new URLSearchParams(location.search).get('token'),$=id=>document.getElementById(id);let watch=null,busy=false;async function call(data){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({...data,token})});const x=await r.json();if(!r.ok||!x.ok)throw Error(x.error||'Erro de ligação.');return x}function message(t){$('msg').textContent=t}function send(pos){return call({action:'driver_update',lat:pos.coords.latitude,lon:pos.coords.longitude,accuracy:pos.coords.accuracy,started:true})}$('start').onclick=async()=>{if(!token){message('Link inválido. Pede um novo link à loja.');return}if(!navigator.geolocation){message('Este dispositivo não suporta localização.');return}if(busy)return;busy=true;$('start').disabled=true;message('A pedir autorização de localização…');try{const pos=await new Promise((resolve,reject)=>navigator.geolocation.getCurrentPosition(resolve,reject,{enableHighAccuracy:true,timeout:20000,maximumAge:0}));await send(pos);watch=navigator.geolocation.watchPosition(async p=>{try{await send(p);message('Localização atualizada · '+new Date().toLocaleTimeString('pt-PT'))}catch(e){message(e.message)}},e=>message('Erro de GPS: '+e.message),{enableHighAccuracy:true,maximumAge:5000,timeout:20000});$('state').textContent='Percurso ativo';$('stop').disabled=false;message('Partilha iniciada. Mantém esta página aberta durante a entrega.')}catch(e){message(e.message||'Não foi possível iniciar a localização.');$('start').disabled=false}finally{busy=false}};$('stop').onclick=async()=>{if(!confirm('Confirmas que a encomenda foi entregue? A localização será desligada.'))return;$('stop').disabled=true;try{if(watch!==null)navigator.geolocation.clearWatch(watch);watch=null;await call({action:'driver_stop'});$('state').textContent='Entrega concluída';message('Localização terminada. Obrigada!');$('start').disabled=true}catch(e){$('stop').disabled=false;message(e.message)}};if(!token){$('start').disabled=true;message('Link inválido.')} })();</script></body></html>
